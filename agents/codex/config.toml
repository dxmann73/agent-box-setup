model = "gpt-5.5"
model_reasoning_effort = "high"
approval_policy = "never"
sandbox_mode = "danger-full-access"
personality = "pragmatic"
approvals_reviewer = "user"

[sandbox_workspace_write]
network_access = true
writable_roots = ["/home/dave"]

[tui]
# Mirrors the Claude Code statusline order: location -> model -> context -> rate limits.
# Item identifiers are a fixed built-in set; unknown entries are silently ignored, so
# verify-setup.sh validates this list. `/statusline` in the TUI edits it and writes back here.
status_line = [
  "current-dir",
  "git-branch",
  "model-with-reasoning",
  "context-used",
  "used-tokens",
  "five-hour-limit",
  "weekly-limit",
]

[tui.model_availability_nux]
"gpt-5.3-codex-spark" = 4
"gpt-5.5" = 4
"gpt-5.6-sol" = 2

[projects."/home/dave/projects/nomap"]
trust_level = "trusted"

[projects."/home/dave/.cursor"]
trust_level = "trusted"

[projects."/home/dave/projects/agent-box-setup"]
